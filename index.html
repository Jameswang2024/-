<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fruit Merge 3D">
<meta name="theme-color" content="#5a351b">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Fruit Merge 3D Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#3a1d0b url("./assets/wood_bg.jpg") center/cover;color:#ffe9b0;display:flex;justify-content:center;align-items:center;touch-action:none}
body:after{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 18%,rgba(255,210,120,.35),transparent 25%),linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.35));pointer-events:none}
.app{position:relative;z-index:1;width:min(100vw,540px);height:100%;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);display:flex;flex-direction:column;justify-content:center}
.topbar{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px;margin-bottom:8px}
.panel{min-height:58px;border-radius:25px;background:linear-gradient(180deg,rgba(104,55,22,.95),rgba(43,21,7,.96));border:2px solid rgba(255,204,103,.42);box-shadow:inset 0 2px 5px rgba(255,230,150,.25),0 10px 22px rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;text-align:center}
.panel small{display:block;font-size:11px;font-weight:900;color:#ffd67f;letter-spacing:.06em}.score strong{font-size:31px;line-height:1;color:#fff4bb;text-shadow:0 3px 0 #5a2a0b,0 0 12px rgba(255,220,110,.65)}
#nextIcon{width:45px;height:45px}.newbtn{font-size:25px;flex-direction:column;font-weight:900;cursor:pointer}
.stage{position:relative;border-radius:36px;padding:13px;background:linear-gradient(145deg,#d3974f,#59290c 48%,#f0bd72);box-shadow:inset 0 4px 9px rgba(255,238,180,.52),inset 0 -7px 14px rgba(35,12,0,.75),0 28px 46px rgba(0,0,0,.5)}
.stage:before{content:"";position:absolute;inset:6px;border-radius:31px;border:2px solid rgba(255,235,165,.38);pointer-events:none}
canvas#game{display:block;width:100%;height:auto;aspect-ratio:450/720;border-radius:26px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.5),inset 0 0 45px rgba(255,255,255,.22),0 8px 20px rgba(0,0,0,.38);background:rgba(255,238,190,.35);touch-action:none}
.tip{margin-top:9px;background:rgba(34,15,4,.72);border:1px solid rgba(255,210,105,.32);border-radius:19px;padding:9px;text-align:center;font-size:14px;font-weight:900;color:#ffe6a2;box-shadow:inset 0 1px 5px rgba(255,255,255,.12)}
.over{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;flex-direction:column;gap:10px;align-items:center;text-align:center;width:78%;max-width:315px;border-radius:30px;padding:28px 20px;background:rgba(30,13,4,.9);backdrop-filter:blur(16px);border:2px solid rgba(255,210,95,.68);box-shadow:0 26px 55px rgba(0,0,0,.6)}
.over h2{font-size:34px;color:#ffe18d;text-shadow:0 3px 0 #6d2d09}button{border:0;border-radius:22px;padding:12px 24px;font-size:17px;font-weight:900;background:linear-gradient(180deg,#ffdf76,#e28124);color:#4a2208;box-shadow:0 5px 0 #78370e}
@media(max-height:760px){.panel{min-height:50px}.score strong{font-size:25px}.tip{font-size:12px;padding:6px}.topbar{margin-bottom:5px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="panel newbtn" id="newBtn">🎲<small>新局</small></div>
    <div class="panel score"><div><small>当前分数</small><strong id="score">0</strong></div></div>
    <div class="panel"><div><small>下一个</small><canvas id="nextIcon" width="90" height="90"></canvas></div></div>
  </div>
  <div class="stage">
    <canvas id="game" width="450" height="720"></canvas>
    <div class="over" id="over"><h2>GAME OVER</h2><p>水果堆太高啦～</p><p>分数：<b id="finalScore">0</b></p><button id="restart">再来一局 🍉</button></div>
  </div>
  <div class="tip">🍊 左右拖动调整位置，松手落下；同类真实水果碰撞合成</div>
</div>
<script>
(function(){
const names=["cherry","strawberry","grape","orange","apple","lemon","kiwi","dragon","pineapple","watermelon"];
const types=[
 {name:"樱桃",r:17,score:2},{name:"草莓",r:21,score:5},{name:"葡萄",r:25,score:9},{name:"橙子",r:30,score:16},{name:"苹果",r:36,score:26},
 {name:"柠檬",r:42,score:40},{name:"猕猴桃",r:49,score:65},{name:"火龙果",r:57,score:100},{name:"菠萝",r:65,score:160},{name:"西瓜",r:76,score:260}
];
const imgs=names.map(n=>{const im=new Image();im.src="./assets/"+n+".png";return im});
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),nextCanvas=document.getElementById("nextIcon"),nctx=nextCanvas.getContext("2d");
const scoreEl=document.getElementById("score"),over=document.getElementById("over"),finalScore=document.getElementById("finalScore");
const W=450,H=720,left=30,right=420,bottom=684,lineY=92,G=.36,BOUNCE=.36,WALL=.48;
let fruits=[],active=null,nextType=0,score=0,gameOver=false,pointerX=W/2,now=0,lastDrop=0,dropCount=0;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rndType(){dropCount++;if(dropCount<=8)return Math.floor(Math.random()*3);const max=Math.min(5,2+Math.floor(score/260));return Math.random()<.74?Math.floor(Math.random()*4):Math.floor(Math.random()*(max+1))}
function drawImageFruit(c,f,x,y,r,rot=0){const im=imgs[f.type??f];c.save();c.translate(x,y);c.rotate(rot);c.shadowColor="rgba(0,0,0,.38)";c.shadowBlur=10;c.shadowOffsetY=5;c.drawImage(im,-r*1.08,-r*1.08,r*2.16,r*2.16);c.restore()}
function drawNext(){nctx.clearRect(0,0,90,90);drawImageFruit(nctx,nextType,45,45,38,0)}
function reset(){fruits=[];active=null;score=0;dropCount=0;gameOver=false;pointerX=W/2;lastDrop=0;scoreEl.textContent="0";over.style.display="none";nextType=Math.floor(Math.random()*3);spawn()}
function spawn(){if(gameOver)return;const t=types[nextType];const type=nextType;nextType=rndType();drawNext();active={type,x:clamp(pointerX,left+t.r,right-t.r),y:54,r:t.r,vx:0,vy:0,rot:0,vr:0,born:now,overSince:null}}
function drawTank(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,"rgba(255,226,155,.72)");bg.addColorStop(.55,"rgba(138,82,36,.66)");bg.addColorStop(1,"rgba(70,32,12,.76)");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(left,42,right-left,bottom-42);
 ctx.fillStyle="rgba(255,255,255,.22)";ctx.fillRect(left+8,52,22,bottom-72);
 ctx.strokeStyle="rgba(255,255,255,.58)";ctx.lineWidth=5;ctx.strokeRect(left,42,right-left,bottom-42);
 ctx.strokeStyle="rgba(70,34,9,.78)";ctx.lineWidth=8;ctx.strokeRect(left-5,37,right-left+10,bottom-32);
 ctx.beginPath();ctx.moveTo(left,lineY);ctx.lineTo(right,lineY);ctx.strokeStyle="rgba(255,82,92,.9)";ctx.lineWidth=3;ctx.setLineDash([8,9]);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle="#ffe08b";ctx.font="bold 12px system-ui";ctx.fillText("安全线",right-48,lineY-7);
 if(active&&!gameOver){ctx.beginPath();ctx.moveTo(active.x,30);ctx.lineTo(active.x,122);ctx.strokeStyle="rgba(255,221,77,.92)";ctx.lineWidth=5;ctx.lineCap="round";ctx.setLineDash([10,12]);ctx.stroke();ctx.setLineDash([])}
}
function draw(){drawTank();for(const f of fruits)drawImageFruit(ctx,f,f.x,f.y,f.r,f.rot);if(active&&!gameOver)drawImageFruit(ctx,active,active.x,active.y,active.r,0)}
function physics(){
 for(const f of fruits){f.vy+=G;f.vx*=.997;f.vy*=.999;f.x+=f.vx;f.y+=f.vy;f.vr*=.985;f.rot+=f.vr;if(f.x-f.r<left){f.x=left+f.r;f.vx=Math.abs(f.vx)*WALL}if(f.x+f.r>right){f.x=right-f.r;f.vx=-Math.abs(f.vx)*WALL}if(f.y+f.r>bottom){f.y=bottom-f.r;f.vy=-Math.abs(f.vy)*BOUNCE;if(Math.abs(f.vy)<.7)f.vy=0;f.vx*=.95}if(f.y-f.r<22){f.y=22+f.r;if(f.vy<0)f.vy=0}}
 for(let pass=0;pass<3;pass++){outer:for(let i=0;i<fruits.length;i++)for(let j=i+1;j<fruits.length;j++){const a=fruits[i],b=fruits[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.01,min=a.r+b.r;if(dist<min){if(a.type===b.type&&a.type<types.length-1&&now-a.born>130&&now-b.born>130){const nt=a.type+1,nf={type:nt,x:(a.x+b.x)/2,y:(a.y+b.y)/2-2,r:types[nt].r,vx:(a.vx+b.vx)*.32,vy:-1.4,rot:0,vr:(Math.random()-.5)*.08,born:now,overSince:null};score+=types[nt].score;scoreEl.textContent=score;fruits.splice(j,1);fruits.splice(i,1);fruits.push(nf);break outer}const nx=dx/dist,ny=dy/dist,over=(min-dist)/2+.05;a.x-=nx*over;b.x+=nx*over;a.y-=ny*over;b.y+=ny*over;const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vel=rvx*nx+rvy*ny;if(vel<0){const imp=-(1+.42)*vel/2;a.vx-=imp*nx;b.vx+=imp*nx;a.vy-=imp*ny;b.vy+=imp*ny}}}}
}
function checkOver(){if(now-lastDrop<1800)return;for(const f of fruits){if(now-f.born<1800)continue;const calm=Math.abs(f.vx)<1.05&&Math.abs(f.vy)<1.05;if(f.y-f.r<lineY&&calm){if(!f.overSince)f.overSince=now;if(now-f.overSince>1700){gameOver=true;finalScore.textContent=score;over.style.display="flex";return}}else f.overSince=null}}
function drop(){if(gameOver||!active)return;active.vx=(pointerX-active.x)*.05+(Math.random()-.5)*.35;active.vy=2.2;active.vr=(Math.random()-.5)*.12;active.born=now;fruits.push(active);active=null;lastDrop=now;setTimeout(()=>{if(!gameOver)spawn()},260)}
function move(clientX){if(!active||gameOver)return;const r=canvas.getBoundingClientRect(),x=(clientX-r.left)*canvas.width/r.width;active.x=clamp(x,left+active.r,right-active.r);pointerX=active.x}
function getX(e){return e.touches?e.touches[0].clientX:e.clientX}
canvas.addEventListener("touchstart",e=>{e.preventDefault();move(getX(e))},{passive:false});canvas.addEventListener("touchmove",e=>{e.preventDefault();move(getX(e))},{passive:false});canvas.addEventListener("touchend",e=>{e.preventDefault();drop()},{passive:false});
canvas.addEventListener("mousedown",e=>move(getX(e)));canvas.addEventListener("mousemove",e=>{if(e.buttons)move(getX(e))});window.addEventListener("mouseup",drop);
document.getElementById("newBtn").onclick=reset;document.getElementById("restart").onclick=reset;
function loop(t){now=t||0;if(!gameOver){physics();checkOver()}draw();requestAnimationFrame(loop)}
Promise.all(imgs.map(im=>new Promise(res=>{im.onload=res;im.onerror=res}))).then(()=>{reset();loop()});
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});</script>
</body>
</html>
